name: APK bauen & veröffentlichen

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: Release-Tag (z. B. v1.4.0) – leer = nur bauen'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version bestimmen
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          DEFAULT=$(sed -n "s/.*APP_VERSION_NAME') ?: '\([^']*\)'.*/\1/p" app/build.gradle)
          NAME="${TAG#v}"; NAME="${NAME:-$DEFAULT}"
          # versionCode steigt mit jedem CI-Lauf, damit Updates sich immer installieren lassen
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Version $NAME ($CODE), Tag: ${TAG:-keins}"

      - name: Eigenen Signaturschlüssel einrichten (falls als Secret hinterlegt)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_PASSWORD=$STORE_PW"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: APKs auflisten
        run: ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: OPTIMUS-IPTV-PRO-${{ steps.ver.outputs.name }}-apk
          path: app/build/outputs/apk/release/*.apk

      - name: GitHub-Release erstellen
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OPTİMUS İptv Player PRO ${{ steps.ver.outputs.name }}
          body_path: CHANGELOG.md
          files: app/build/outputs/apk/release/*.apk
          make_latest: true
