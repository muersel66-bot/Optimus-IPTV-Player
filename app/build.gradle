plugins {
    id 'com.android.application'
}

android {
    namespace 'tr.optimus.iptv'
    compileSdk 34

    defaultConfig {
        applicationId 'tr.optimus.iptv'
        minSdk 26
        targetSdk 34
        versionCode 4590
        versionName '4.59'

        // Boyutu küçültmek için yalnızca telefon/TV işlemci mimarileri
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Sabit imza anahtarı: yeni sürümler eskisinin üzerine kurulabilir.
    signingConfigs {
        optimus {
            storeFile file('optimus.keystore')
            storePassword 'optimus123'
            keyAlias 'optimus'
            keyPassword 'optimus123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.optimus
        }
        debug {
            signingConfig signingConfigs.optimus
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // VLC çekirdeği: Dolby Digital (AC-3), Dolby Digital Plus (E-AC-3), DTS ve diğer sesleri çözer
    implementation 'org.videolan.android:libvlc-all:3.6.0'
    // Telefon kamerasıyla QR tarama (Google Play Hizmetleri kod tarayıcısı; kamera izni gerektirmez)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // ExoPlayer (Media3): HLS / DASH / MP4 / HEVC / HDR, cihazın donanım çözücüleriyle
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
